[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-api-buyer"
version = "0.1.0"
description = "Bilingual Telegram CSV test marketplace with atomic accounting"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.17,<4", "SQLAlchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
  "cryptography>=44,<47",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
