name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: marketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U marketplace -d marketplace'
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://marketplace:synthetic-ci-password@localhost:5432/marketplace
      TEST_DATABASE_URL: postgresql+asyncpg://marketplace:synthetic-ci-password@localhost:5432/marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check app tests migrations scripts
      - run: uv run ruff format --check app tests migrations scripts
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: '3.12'
      - run: uv sync --frozen --extra psycopg
      - run: uv run --extra psycopg pytest tests/test_runtime.py -q
